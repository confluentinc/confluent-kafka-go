syntax = "proto3";

// The path this file used to occupy, kept so a descriptor generated against the old import path
// still resolves. It declares nothing and re-exports the canonical file, so confluent.type.Decimal
// is visible through it without a second declaration of the symbol - which a descriptor pool
// refuses ("duplicate symbol"). Read-only compatibility: the clients emit the canonical path.
import public "confluent/type/decimal.proto";
